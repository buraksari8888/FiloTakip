<header class="topbar">
  <a class="brand" routerLink="/"><span class="logo" aria-hidden="true">🚚</span> FiloTakip</a>
  <nav>
    <a routerLink="/harita" routerLinkActive="active">Harita</a>
    <a routerLink="/gecmis" routerLinkActive="active">Geçmiş</a>
    <a routerLink="/araclar" routerLinkActive="active">Araçlar</a>
    <a routerLink="/alarmlar" routerLinkActive="active">
      Alarmlar
      @if (unreadAlarms() > 0) {
        <span class="badge" [attr.aria-label]="unreadAlarms() + ' okunmamış alarm'">{{ unreadAlarms() }}</span>
      }
    </a>
  </nav>

  <span class="live" [class]="liveStatus()" [attr.title]="liveStatusText[liveStatus()].title">
    <span class="live-label">{{ liveStatusText[liveStatus()].label }}</span>
  </span>

  <button
    type="button"
    class="theme-toggle"
    [attr.aria-label]="theme.theme() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'"
    [title]="theme.theme() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'"
    (click)="theme.toggle()"
  >
    {{ theme.theme() === 'dark' ? '☀' : '☾' }}
  </button>
</header>

<main>
  <!-- Adres çubuğundaki adrese göre (app.routes.ts) sayfa buraya çizilir -->
  <router-outlet />
</main>
