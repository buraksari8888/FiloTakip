<p class="alert" role="alert">
  @if (action(); as action) {
    <strong>{{ action }}:</strong>
  }
  {{ message() }}
  @for (detail of details(); track $index) {
    <span class="detail">{{ detail }}</span>
  }
  @if (unreachable()) {
    (<code>backend/FiloTakip.Api</code> klasöründe <code>dotnet run</code>)
  }
  @if (traceId(); as traceId) {
    <small class="trace">Hata kodu: <code>{{ traceId }}</code></small>
  }
</p>
